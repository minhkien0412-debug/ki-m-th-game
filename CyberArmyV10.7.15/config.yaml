# CyberArmy V10.7.15 - Game Security Testing System Configuration

# Target configuration
target:
  name: "Game Security Test"
  base_url: "https://example-game.com"
  allowed_hosts:
    - "example-game.com"
    - "*.example-game.com"
    - "api.example-game.com"
  allowed_paths:
    - "/api/*"
    - "/game/*"
    - "/assets/*"
  blocked_paths:
    - "/admin/*"
    - "/internal/*"
    - "/debug/*"

# Policy configuration
policy:
  raw_file: "policies/raw/banco_plata_policy.json"
  manifest_file: "policies/manifest/banco_plata_manifest.json"
  required_hash: "sha256:placeholder_hash_here"
  acknowledged: false
  kill_switch_enabled: true

# Rate limiting
rate_limit:
  requests_per_second: 5
  requests_per_minute: 100
  concurrent_connections: 3

# Reconnaissance settings
recon:
  subfinder_enabled: true
  crtsh_enabled: true
  passive_only: true

# Analysis settings
analysis:
  web_analyzer_enabled: true
  api_analyzer_enabled: true
  code_analyst_enabled: false
  extract_forms: true
  extract_endpoints: true

# Validation settings (CONSERVATIVE - safe only)
validation:
  enabled: false
  safe_validators_only: true
  reflection_test: false
  authorization_boundary_test: false
  manual_review_required: true

# Evidence storage
evidence:
  store_traffic: true
  redact_secrets: true
  evidence_dir: "state/evidence"

# Reporting
reporting:
  output_dir: "state/reports"
  format: "markdown"
  include_evidence: true
  verbose: true

# Logging
logging:
  level: "INFO"
  file: "state/mission.log"
  console: true

# HackerOne PlayStation mode (fail-closed)
# Copy assets only from the current official HackerOne scope page. Do not use
# third-party scope mirrors as authorization, and re-check before every session.
hackerone:
  enabled: false
  program_handle: "playstation"
  policy_url: "https://hackerone.com/playstation/policy_scopes"
  researcher_handle: ""
  acknowledged_current_policy: false
  human_in_the_loop: true
  scope_reviewed_at: ""
  scope_max_age_days: 1
  report_output_dir: "state/hackerone_drafts"
  observation_output_dir: "state/hackerone_observations"
  max_passive_results: 50
  scope_assets: []
  # Example after manual verification:
  # Add the apex and wildcard as separate entries only when both appear in scope.
  # - type: "domain"
  #   identifier: "*.verified-in-scope.example"
  #   eligible_for_submission: true
  #   allowed_actions: ["passive_recon", "http_get", "http_head", "manual_validation", "reporting"]

# Isolated self-hosted research lab. This profile never authorizes testing a
# public service, third-party console, production account, or privileged kernel.
local_lab:
  enabled: false
  authorized_self_hosted_only: false
  human_in_the_loop: true
  network_isolated: false
  authorization_reference: ""
  workspace_root: "."
  max_api_cases: 16
  max_concurrency: 2
  max_fuzz_cases: 50
  max_input_bytes: 1048576
  max_response_bytes: 262144
  process_timeout_seconds: 5
  allowed_executable_extensions: [".exe"]
  trace_output_dir: "state/lab_traces"
  fuzz_output_dir: "state/lab_fuzz"

# Authorized PlayStation developer/test-kit bridge. The project does not ship
# Sony SDK binaries or credentials. Register at https://partners.playstation.net/
# and use only commands documented for your official SDK version.
console_lab:
  enabled: false
  partner_access_confirmed: false
  official_sdk_installed: false
  dev_or_test_kit_only: false
  human_in_the_loop: true
  network_isolated: false
  allow_device_execution: false
  authorization_reference: ""
  platform: ""  # ps4 or ps5
  kit_id: ""
  workspace_root: "."
  process_timeout_seconds: 30
  max_artifact_bytes: 1073741824
  max_crash_bytes: 268435456
  max_corpus_files: 1000
  max_telemetry_rows: 100000
  frame_budget_ms: 16.667
  allowed_artifact_extensions: [".pkg", ".self", ".elf"]
  allowed_crash_extensions: [".dmp", ".core", ".log", ".txt", ".json"]
  artifact_output_dir: "state/console_artifacts"
  session_output_dir: "state/console_sessions"
  sdk_environment_allowlist: []
  # YAML argv lists; the first item must be the absolute path to an official
  # SDK executable. Supported placeholders are {artifact}, {kit_id}, {crash},
  # {symbols}, and {output_dir}. No shell is used.
  run_command: []
  symbolicate_command: []
  preflight_command: []
  deploy_command: []
  launch_command: []
  collect_command: []
  stop_command: []
